[pytest]
pythonpath = .
testpaths = tests/api tests/phone
python_files = test_*.py
python_functions = test_*
markers =
    phone: requires physical phone connected via ADB
    api: API-only test, no phone needed
    config: modifies router configuration (pricing/metric)
    slow: test takes more than 30 seconds
    android_only: requires physical Android device
    smoke: quick sanity check (~15s total, API-only)
    critical: core functionality (~2min)
    extended: full suite including edge cases (~10min)
    publish_screenshot: screenshot from this test is safe to include in published reports
    pr(N): test introduced for upstream PR #N (expected to pass on that branch, may fail on others)
    pay_via: how payment flows through connected_wifi fixture. Options: "portal" (default), "skip", "url_param"
    virtual_lab: tests for local QEMU/network-namespace virtual lab plumbing
    go_only: test requires Go v1 backend (LuCI, CLI socket, sessions.json)
    rust_only: test requires Rust v1 backend
    requires_wifi: requires physical WiFi adapter (skipped in --client=container mode)
    firewall: tests for OpenWrt firewall rules (RFC 1918 isolation, zone policies)
addopts =
    -v
    --tb=short
    --timeout=60
    --timeout-method=thread
render_collapsed = skipped
